name: Code Quality Assurance

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering
  workflow_call: # Allow referencing from other workflows (e.g. publish.yaml)

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check linting
        run: uv run ruff check slb_glossary/

      - name: Check formatting
        run: uv run ruff format slb_glossary/ --check

      - name: Run security analysis
        run: |
          echo "Running Bandit security analysis..."
          uv run bandit -r slb_glossary/ -s B101 -f json -o bandit-report.json || true
          uv run bandit -r slb_glossary/ -s B101
        continue-on-error: false

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      # Pinned to match [tool.mypy] python_version in pyproject.toml.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # Deliberately `mcp`, not `all`/`semantic`: numpy (pulled in
      # transitively by `semantic` via model2vec) ships a stub using
      # Python 3.12+ syntax that crashes mypy outright under this
      # project's pinned python_version = "3.10" - see the numpy
      # override comment in pyproject.toml.
      - name: Install dependencies
        run: uv sync --group dev --extra mcp --inexact

      - name: Run type checking
        run: |
          echo "Running mypy type checking..."
          uv run mypy
        continue-on-error: false
