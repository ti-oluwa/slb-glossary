[project]
name = "slb-glossary"
version = "0.1.0"
description = "Search the SLB Energy Glossary in Python."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Daniel T. Afolayan", email = "tioluwa.dev@gmail.com" }]
requires-python = ">=3.10"
keywords = ["slb", "schlumberger", "glossary", "scraper", "playwright", "patchright", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "patchright>=1.61.0",
    "playwright-stealth>=2.0.3",
    "rich>=13.0.0",
    "click>=8.1.7",
    "aiosqlite>=0.20.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
tui = ["trogon>=0.6.0", "textual>=0.58"]
config = ["tomlkit>=0.12", "pyyaml>=6.0"]
mcp = ["fastmcp>=2.9,<4", "typing-extensions>=4.6; python_version < '3.11'"]
all = ["slb-glossary[xlsx,tui,config,mcp]"]

[project.scripts]
slb-glossary = "slb_glossary.cli.main:main"
slb = "slb_glossary.cli.main:main"

[project.urls]
Homepage = "https://github.com/ti-oluwa/slb_glossary"
Repository = "https://github.com/ti-oluwa/slb_glossary"
Issues = "https://github.com/ti-oluwa/slb_glossary/issues"

[dependency-groups]
dev = ["ruff>=0.13", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slb_glossary"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ASYNC", # flake8-async
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["slb_glossary"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
files = ["slb_glossary"]
show_error_codes = true
pretty = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# Optional-extra and vendored dependencies that may not ship inline types
# or a py.typed marker. Harmless to list a module here even if it turns
# out to be fully typed. This only suppresses the "missing stubs" error,
# it doesn't turn off checking against whatever types *are* found.
module = [
    "patchright.*",
    "playwright_stealth.*",
    "openpyxl.*",
    "trogon.*",
    "textual.*",
    "fastmcp.*",
    "tomlkit.*",
    "yaml.*",
]
ignore_missing_imports = true
